<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triana Residences · CRM</title><link rel="icon" href="apple-touch-icon-v3.png"><style>
@font-face{font-family:CRMInter;src:url('assets/inter-latin-variable.woff2') format('woff2');font-weight:100 900;font-display:swap}*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#203747;font:14px CRMInter,Arial,sans-serif}header,main{max-width:1120px;margin:auto;padding:24px}header{border-bottom:1px solid #dfe5e9}header .row{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px;font-weight:600}.brand img{width:36px;height:36px;border-radius:9px}select,button{font:inherit;color:inherit}select{background:white;border:1px solid #dfe5e9;border-radius:12px;padding:10px}label{display:flex;align-items:center;gap:10px}h1{font-size:24px;font-weight:600;margin:32px 0 8px}p{line-height:1.65;color:#637381}.status{display:inline-block;padding:5px 10px;border-radius:20px;background:#eee7d7;color:#79612c;font-size:12px}nav{display:flex;gap:6px;overflow:auto;margin:24px 0;border-bottom:1px solid #dfe5e9;padding-bottom:12px}nav button{border:0;background:transparent;border-radius:20px;padding:10px 16px;cursor:pointer;white-space:nowrap}nav button[aria-selected=true]{background:#203747;color:white}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:white;border:1px solid #e1e6ea;border-radius:16px;padding:22px}.card span{font-size:13px;color:#637381}.card strong{display:block;font-size:26px;margin-top:18px;font-weight:600}.panel{margin-top:20px}h2{font-size:17px;margin:0 0 12px;font-weight:600}.settings{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}.setting{padding:16px 0;border-bottom:1px solid #edf0f2;display:flex;justify-content:space-between;gap:20px}.setting span:last-child{color:#637381;text-align:right;overflow-wrap:anywhere;max-width:65%}a{color:#203747}.empty{padding:45px 20px;text-align:center}@media(max-width:600px){header,main{padding:18px}.cards{grid-template-columns:1fr 1fr}.settings{grid-template-columns:1fr}h1{font-size:22px}.card{padding:18px}label{width:100%}select{flex:1}}
</style></head><body><header><div class="row"><div class="brand"><img src="apple-touch-icon-v3.png" alt="Purvanchal">Purvanchal CRM</div><label>Project<select id="project" aria-label="Select project"><option value="sunbliss">Sunbliss Residences</option><option value="triana" selected>Triana Residences</option></select></label></div></header><main><h1>Triana Residences</h1><span class="status">Setup in progress</span><p>Project details have been checked against existing records. Inventory and customer records are awaiting import; the figures below show CRM records only.</p><nav role="tablist" aria-label="Project sections"></nav><section id="content" role="tabpanel" aria-live="polite"></section></main><script>
/* This setup workspace deliberately has no data client or operational writes. */
const tabs=['Overview','Units','Bookings','Payments','Scheduled Tasks','Project Settings'];
const messages={Units:['No units added yet','The inventory will appear here once the approved unit list is added.'],Bookings:['No bookings imported yet','Existing bookings will be reconciled against their signed documents before import.'],Payments:['No payments imported yet','Existing receipts and Accounts confirmations will be reconciled with each booking before import.'], 'Scheduled Tasks':['No scheduled tasks','Tasks will become available when Triana booking workflows are configured.']};
function settings(){return '<div class="panel"><h2>Project settings</h2><div class="settings">'+[['Project name','Triana Residences'],['Developer','Purvanchal Real Estate Developers LLC'],['Developer registration','1496'],['Location','Jumeirah Garden City (Al Satwa), Dubai, UAE'],['Plot number','334-2940'],['Master developer','MERAAS ESTATES (L.L.C)'],['Ownership','Freehold'],['Office','105, Opal Tower, Business Bay, Dubai'],['P.O. Box','64567'],['CRM email','crm@purvanchaluae.ae'],['Landline','+971 4 397 7033'],['Inventory','Awaiting unit list'],['Payment plan','Booking-specific; awaiting configuration'],['Bank details','Awaiting account verification'],['Document templates','Existing samples located; configuration pending'],['Booking entry','Awaiting inventory and payment settings']].map(x=>'<div class="setting"><span>'+x[0]+'</span><span>'+x[1]+'</span></div>').join('')+'</div></div>';}
function show(tab){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.textContent===tab)));document.getElementById('content').innerHTML=tab==='Overview'?'<div class="cards">'+[['Imported Units','0'],['Imported Bookings','0'],['Recorded Collections','AED 0'],['Scheduled Tasks','0']].map(x=>'<div class="card"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('')+'</div>'+settings():tab==='Project Settings'?settings():'<div class="panel empty"><h2>'+messages[tab][0]+'</h2><p>'+messages[tab][1]+'</p></div>';}
tabs.forEach(t=>{const b=document.createElement('button');b.type='button';b.role='tab';b.textContent=t;b.onclick=()=>show(t);document.querySelector('nav').appendChild(b);});
document.getElementById('project').onchange=e=>{if(e.target.value==='sunbliss')location.assign('index.html');};show('Overview');
</script></body></html>
