<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunbliss Residences — Sales & Collections Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --ink:#16232F;
    --ink-2:#0F1A26;
    --paper:#F6F1E4;
    --paper-dim:#EBE3CE;
    --paper-line:#DCD2B6;
    --gold:#C6972E;
    --gold-deep:#8F6A1E;
    --cream-text:#EDE6D6;
    --cream-text-dim:#B9AF9A;
    --sage:#3F7A57;
    --rust:#AE3B2B;
    --amber:#9C5A12;
    --slate:#45566B;
    --muted:#736C5C;
    --radius:14px;
    --shadow:0 1px 2px rgba(15,26,38,.08), 0 6px 20px rgba(15,26,38,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink-2);
    background-image:
      radial-gradient(1200px 600px at 15% -10%, rgba(198,151,46,.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(198,151,46,.06), transparent 55%);
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:640px;margin:0 auto;padding:0 0 48px;}
  a,button{font-family:inherit;}
  button{cursor:pointer;}
  ::selection{background:rgba(198,151,46,.35);}

  /* ---------- header ---------- */
  .topbar{
    padding:28px 20px 20px;
    color:var(--cream-text);
    animation:fadeIn .5s ease both;
  }
  @media (prefers-reduced-motion: reduce){ .topbar{animation:none;} }
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold);margin:0 0 6px;
  }
  .title{
    font-family:'Fraunces',serif;font-weight:600;font-size:30px;line-height:1.1;
    margin:0 0 4px;letter-spacing:-.01em;
  }
  .subtitle{
    font-size:13.5px;color:var(--cream-text-dim);margin:0 0 18px;
  }
  .sync-row{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid rgba(237,230,214,.25);
    background:rgba(237,230,214,.06);
    color:var(--cream-text);
    padding:9px 14px;border-radius:999px;
    font-size:13px;font-weight:500;
    transition:background .15s ease, border-color .15s ease;
  }
  .btn:hover{background:rgba(237,230,214,.13);border-color:rgba(237,230,214,.4);}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .btn-gold{
    background:var(--gold);border-color:var(--gold);color:var(--ink-2);font-weight:600;
  }
  .btn-gold:hover{background:#D6A63E;}
  .sync-status{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;color:var(--cream-text-dim);
  }
  .sync-status b{color:var(--cream-text);font-weight:500;}

  /* ---------- branding ---------- */
  .brand-row{display:flex;align-items:center;gap:10px;}
  .brand-letterhead-preview{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .brand-letterhead-preview img{max-height:56px;max-width:160px;border-radius:6px;border:1px solid var(--paper-line);}
  .brand-letterhead-preview button{background:none;border:none;color:var(--rust);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;}
  .brand-edit-btn{
    flex:none;background:rgba(237,230,214,.08);border:1px solid rgba(237,230,214,.2);border-radius:8px;
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--cream-text-dim);
  }
  .brand-edit-btn:hover{background:rgba(237,230,214,.16);color:var(--cream-text);}
  .brand-edit-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .brand-tagline{font-size:12px;color:var(--cream-text-dim);font-style:italic;margin:-10px 0 14px;}
  .brand-editor{background:var(--paper);color:var(--ink);border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .brand-field{display:block;font-size:11.5px;color:var(--muted);margin-bottom:11px;}
  .brand-field input[type="text"], .brand-field input[type="number"], .brand-field textarea{
    display:block;width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--paper-line);
    border-radius:8px;font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);background:var(--paper-dim);
    box-sizing:border-box;
  }
  .brand-field input[type="file"]{display:block;width:100%;margin-top:5px;font-size:11.5px;}
  .brand-editor-actions{display:flex;gap:8px;margin-top:6px;}
  .brand-editor-actions .btn, .brand-editor-actions .btn-paper{flex:1;justify-content:center;margin-bottom:0;}
  .brand-error{color:var(--rust);font-size:11.5px;margin:-2px 0 10px;}

  .btn-paper{
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--paper-line);background:var(--paper-dim);color:var(--ink);
    padding:9px 14px;border-radius:999px;font-size:12.5px;font-weight:500;margin-bottom:14px;
    text-decoration:none;
  }
  .btn-paper:hover{background:var(--paper);border-color:var(--gold-deep);}
  .btn-paper:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px;}
  .reminder-actions{display:flex;gap:9px;flex-wrap:wrap;margin:2px 0 18px;}
  .reminder-actions .btn-paper{margin-bottom:0;}

  /* ---------- print output ---------- */
  #printArea{display:none;}
  @media print{
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block !important;position:static;width:100%;margin:0;padding:0;}
    body{background:#fff;}
  }
  .print-doc{font-family:'Inter',sans-serif;color:#111;padding:28px;max-width:800px;margin:0 auto;}
  .print-doc .print-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#555;margin:0 0 4px;}
  .print-doc h1{font-family:'Fraunces',serif;font-size:21px;margin:0 0 4px;}
  .print-doc .print-sub{font-size:11.5px;color:#555;margin:0 0 4px;}
  .print-doc h2{font-family:'Fraunces',serif;font-size:14px;margin:22px 0 8px;border-bottom:1px solid #111;padding-bottom:5px;page-break-after:avoid;}
  .print-doc table{width:100%;border-collapse:collapse;margin:6px 0 18px;font-size:11px;page-break-inside:auto;}
  .print-doc tr{page-break-inside:avoid;}
  .print-doc th{text-align:left;border-bottom:2px solid #111;padding:5px 7px;font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.03em;}
  .print-doc td{border-bottom:1px solid #ddd;padding:5px 7px;}
  .print-doc .print-summary-grid{display:flex;gap:22px;margin:16px 0 6px;flex-wrap:wrap;}
  .print-doc .print-summary-item{flex:1;min-width:100px;}
  .print-doc .print-summary-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:#666;margin:0 0 2px;}
  .print-doc .print-summary-value{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:0;}
  .print-doc .print-footer{margin-top:30px;padding-top:12px;border-top:1px solid #ccc;font-size:9.5px;color:#777;}
  .print-doc .print-exec-summary{background:#f7f2e4;border-left:3px solid #C6972E;padding:13px 16px;margin:16px 0 22px;}
  .print-doc .print-exec-summary p{margin:0;font-size:12px;line-height:1.65;color:#242424;}
  .print-doc .print-callout{background:#fbf1ec;border-left:3px solid #AE3B2B;padding:12px 16px;margin:14px 0 20px;}
  .print-doc .print-callout-title{font-family:'Fraunces',serif;font-weight:700;font-size:12px;margin:0 0 4px;color:#8a2f21;}
  .print-doc .print-callout p{margin:0;font-size:11.5px;line-height:1.6;color:#333;}
  .print-doc .chart-caption{font-size:10.5px;color:#777;margin:0 0 10px;}
  .print-letterhead-bg{
    position:fixed;top:0;left:0;width:100vw;height:100vh;
    background-repeat:no-repeat;background-size:100% 100%;z-index:-1;display:none;
  }
  @media print{
    @page{margin:0;}
    .print-letterhead-bg{display:block;}
  }
  .print-doc.has-letterhead{padding-top:var(--lh-top,200px);padding-bottom:var(--lh-bottom,100px);}

  /* ---------- main paper panel ---------- */
  main{background:var(--paper);border-radius:22px 22px 0 0;min-height:60vh;box-shadow:var(--shadow);}

  /* ---------- empty state ---------- */
  .empty{padding:56px 24px 64px;text-align:center;}
  .empty-badge{
    width:56px;height:56px;margin:0 auto 18px;border-radius:50%;
    border:1.5px solid var(--gold-deep);outline:1.5px solid var(--gold-deep);outline-offset:4px;
    display:flex;align-items:center;justify-content:center;
    color:var(--gold-deep);font-family:'Fraunces',serif;font-size:22px;font-weight:600;
  }
  .empty h2{font-family:'Fraunces',serif;font-size:21px;margin:0 0 8px;}
  .empty p{font-size:13.5px;color:var(--muted);max-width:360px;margin:0 auto 22px;line-height:1.55;}
  .empty-error{
    margin:0 auto 18px;max-width:380px;
    background:rgba(174,59,43,.08);border:1px solid rgba(174,59,43,.3);
    color:var(--rust);font-size:12.5px;padding:10px 14px;border-radius:10px;text-align:left;
  }

  /* ---------- KPI strip ---------- */
  .kpis{
    display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
    background:var(--paper-line);border-bottom:1px solid var(--paper-line);
  }
  .kpi{background:var(--paper);padding:16px 14px;}
  .kpi-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 5px;}
  .kpi-value{font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:var(--ink);}
  .kpi-sub{font-size:11px;color:var(--muted);margin-top:2px;}

  /* ---------- search / filters ---------- */
  .controls{padding:16px 18px 10px;}
  .search{
    display:flex;align-items:center;gap:8px;
    background:var(--paper-dim);border:1px solid var(--paper-line);border-radius:12px;
    padding:10px 14px;margin-bottom:10px;
  }
  .search svg{flex:none;opacity:.55;}
  .search input{
    border:none;background:none;outline:none;width:100%;
    font-family:'Inter',sans-serif;font-size:14.5px;color:var(--ink);
  }
  .search input::placeholder{color:var(--muted);}
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:2px;}
  .chip{
    flex:none;border:1px solid var(--paper-line);background:var(--paper);
    padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted);
    transition:all .15s ease;
  }
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .chip:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px;}
  .result-count{font-size:11.5px;color:var(--muted);margin:10px 2px 2px;font-family:'IBM Plex Mono',monospace;}

  .filter-toggle{
    display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    padding:11px 14px;border-radius:12px;background:var(--paper-dim);border:1px solid var(--paper-line);
    font-size:13px;font-weight:600;color:var(--ink);margin-bottom:10px;
  }
  .filter-toggle-left{display:flex;align-items:center;gap:8px;}
  .filter-badge{
    background:var(--gold-deep);color:var(--paper);font-size:10px;font-weight:700;
    padding:2px 7px;border-radius:999px;font-family:'IBM Plex Mono',monospace;
  }
  .filter-toggle svg{transition:transform .2s ease;opacity:.6;}
  .filter-toggle[aria-expanded="true"] svg{transform:rotate(180deg);}
  .filter-panel{
    background:var(--paper-dim);border:1px solid var(--paper-line);border-radius:12px;
    padding:14px 14px 4px;margin-bottom:10px;
  }
  .filter-group{margin-bottom:14px;}
  .filter-group-label{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);margin:0 0 7px;
  }
  .filter-panel .chip{background:var(--paper);}
  .filter-panel .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .btn-clear-filters{
    display:block;width:100%;text-align:center;background:none;border:none;
    color:var(--rust);font-size:12.5px;font-weight:600;padding:8px 0 10px;
  }
  .active-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .active-pill{
    display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper);
    font-size:11.5px;font-weight:500;padding:5px 8px 5px 12px;border-radius:999px;border:none;
  }
  .active-pill .x{opacity:.65;font-size:13px;line-height:1;}
  .active-pill:hover .x{opacity:1;}

  /* ---------- list ---------- */
  .list{padding:6px 10px 18px;}
  .row-btn{
    display:flex;width:100%;text-align:left;align-items:center;gap:12px;
    background:none;border:none;border-bottom:1px solid var(--paper-line);
    padding:13px 8px;
  }
  .row-btn:hover{background:rgba(198,151,46,.06);}
  .row-btn:focus-visible{outline:2px solid var(--gold-deep);outline-offset:-2px;border-radius:8px;}
  .row-unit{
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--gold-deep);
    background:rgba(198,151,46,.12);padding:4px 8px;border-radius:6px;flex:none;
  }
  .row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .row-name{display:block;font-family:'Fraunces',serif;font-size:14.5px;font-weight:500;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-meta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;}
  .row-dot{width:5px;height:5px;border-radius:50%;background:var(--rust);flex:none;}
  .row-amt{flex:none;max-width:132px;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .row-amt-val{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;white-space:nowrap;}
  .row-amt-lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;line-height:1.35;}
  .no-results{padding:36px 20px;text-align:center;color:var(--muted);font-size:13.5px;}

  /* ---------- detail view ---------- */
  .detail{padding:16px 18px 30px;}
  .back{
    display:inline-flex;align-items:center;gap:6px;border:none;background:none;
    color:var(--muted);font-size:13px;font-weight:500;padding:6px 4px;margin-bottom:10px;
  }
  .back:hover{color:var(--ink);}
  .back:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px;border-radius:6px;}
  .d-unit{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:var(--gold-deep);}
  .d-name{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin:4px 0 2px;line-height:1.15;}
  .d-type{font-size:12.5px;color:var(--muted);margin-bottom:12px;}
  .badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
  .badge{
    font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--paper-line);
    color:var(--muted);font-weight:500;background:var(--paper-dim);
  }
  .badge-good{color:var(--sage);border-color:rgba(63,122,87,.35);background:rgba(63,122,87,.08);}
  .badge-warn{color:var(--amber);border-color:rgba(156,90,18,.35);background:rgba(156,90,18,.08);}

  .money-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--paper-line);
    border:1px solid var(--paper-line);border-radius:12px;overflow:hidden;margin-bottom:14px;}
  .money-cell{background:var(--paper);padding:12px 10px;}
  .money-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;}
  .money-value{font-family:'Fraunces',serif;font-weight:600;font-size:15px;}
  .money-value.owed{color:var(--rust);}
  .money-value.credit{color:var(--sage);}

  .notice{
    background:linear-gradient(180deg, rgba(198,151,46,.10), rgba(198,151,46,.04));
    border:1px solid rgba(198,151,46,.35);border-radius:12px;
    padding:12px 14px;margin-bottom:18px;
  }
  .notice-title{font-size:12.5px;font-weight:600;color:var(--amber);margin:0 0 3px;display:flex;gap:6px;align-items:baseline;}
  .notice-body{font-size:12.5px;color:var(--ink);line-height:1.5;margin:0;}
  .notice-sub{font-size:11.5px;color:var(--muted);margin-top:6px;}

  .section-label{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin:22px 2px 10px;
  }

  .ledger-scroll{
    display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
  }
  .ledger-scroll::-webkit-scrollbar{height:5px;}
  .ledger-scroll::-webkit-scrollbar-thumb{background:var(--paper-line);border-radius:3px;}
  .stage-card{
    flex:0 0 148px;scroll-snap-align:start;
    background:var(--paper);border:1px solid var(--paper-line);border-radius:12px;
    padding:12px 12px 14px;
  }
  .stage-name{font-family:'Fraunces',serif;font-size:13px;font-weight:600;margin-bottom:8px;}
  .stamp{
    display:inline-block;padding:4px 10px;margin-bottom:10px;
    border:1.5px solid currentColor;border-radius:999px;
    box-shadow:0 0 0 3px var(--paper);outline:1.5px solid currentColor;outline-offset:3px;
    font-family:'Fraunces',serif;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    font-size:9.5px;white-space:nowrap;transform:rotate(var(--tilt,-4deg));
  }
  @media (prefers-reduced-motion: reduce){ .stamp{transform:none;} }
  .is-paid{color:var(--sage);}
  .is-partial{color:var(--amber);}
  .is-overdue{color:var(--rust);}
  .is-upcoming{color:var(--slate);}
  .is-pending{color:var(--slate);}
  .is-na{color:var(--muted);opacity:.5;border-style:dashed;box-shadow:none;outline-style:dashed;}
  .stage-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;gap:6px;}
  .stage-row span:first-child{color:var(--muted);}
  .stage-row span:last-child{font-family:'IBM Plex Mono',monospace;text-align:right;}
  .stage-late{font-size:10px;color:var(--rust);margin-top:6px;}

  .tx-list{border-top:1px solid var(--paper-line);}
  .tx-row{display:flex;gap:10px;padding:11px 2px;border-bottom:1px solid var(--paper-line);align-items:baseline;}
  .tx-date{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);flex:none;width:74px;line-height:1.4;}
  .tx-main{flex:1;min-width:0;}
  .tx-towards{display:block;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx-status{font-size:10.5px;color:var(--muted);}
  .tx-amt{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;flex:none;}
  .tx-empty{padding:16px 2px;font-size:12.5px;color:var(--muted);}

  .footnote{font-size:11px;color:var(--muted);text-align:center;padding:22px 20px 4px;}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:4px;padding:14px 18px 4px;}
  .tab{
    flex:1;text-align:center;padding:9px 10px;border-radius:10px;border:1px solid transparent;
    background:none;font-size:12.5px;font-weight:600;color:var(--muted);
    font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;text-transform:uppercase;
  }
  .tab[aria-pressed="true"]{background:var(--paper-dim);border-color:var(--paper-line);color:var(--ink);}
  .tab:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px;}

  /* ---------- overview ---------- */
  .overview{padding:6px 18px 24px;}
  .stat-hero{
    display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--paper-line);
    border:1px solid var(--paper-line);border-radius:14px;overflow:hidden;margin:14px 0 22px;
  }
  .stat-cell{background:var(--paper);padding:15px 14px;}
  .stat-cell.wide{grid-column:1/-1;}
  .stat-cell.clickable{border:none;text-align:left;font-family:inherit;width:100%;cursor:pointer;}
  .stat-cell.clickable:hover, .stat-cell.clickable:active{background:var(--paper-dim);}
  .stat-cell.clickable:focus-visible{outline:2px solid var(--gold-deep);outline-offset:-2px;}
  .stat-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;}
  .stat-value{font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:var(--ink);}
  .stat-sub{font-size:10.5px;color:var(--muted);margin-top:3px;}

  .bar{height:8px;border-radius:5px;background:rgba(174,59,43,.15);overflow:hidden;}
  .bar-fill{height:100%;background:var(--sage);border-radius:5px 0 0 5px;}
  .bar-caption{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:7px;}
  .bar-caption b{color:var(--ink);font-weight:600;}
  .cust-progress{margin:-6px 0 18px;}

  .pipeline{display:flex;gap:9px;flex-wrap:wrap;margin:2px 0 18px;}
  .pill-stat{
    flex:1;min-width:104px;background:var(--paper);border:1px solid var(--paper-line);border-radius:12px;
    padding:11px 12px;
  }
  .pill-stat.clickable{text-align:left;font-family:inherit;cursor:pointer;}
  .pill-stat.clickable:hover, .pill-stat.clickable:active{background:var(--paper-dim);}
  .pill-stat.clickable:focus-visible{outline:2px solid var(--gold-deep);outline-offset:-2px;}
  .pill-stat-num{font-family:'Fraunces',serif;font-weight:600;font-size:16px;display:flex;align-items:center;}
  .pill-stat-lbl{font-size:10px;color:var(--muted);margin-top:3px;}
  .pill-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;flex:none;}

  .mix-row{display:flex;align-items:center;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--paper-line);font-size:12.5px;}
  .mix-label{font-weight:600;color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .mix-count{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .mix-value{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink);}

  .stage-tbl{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:4px;}
  .stage-tbl th{
    text-align:right;font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;
    letter-spacing:.04em;color:var(--muted);font-weight:500;padding:0 0 8px;
  }
  .stage-tbl th:first-child{text-align:left;}
  .stage-tbl td{padding:7px 0;border-top:1px solid var(--paper-line);text-align:right;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .stage-tbl td:first-child{text-align:left;font-family:'Fraunces',serif;font-weight:500;color:var(--ink);white-space:normal;}
  .stage-tbl td.neg{color:var(--rust);}
  .stage-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:8px;}
  .stage-scroll .stage-tbl{min-width:440px;}

  .tx-row-btn{width:100%;background:none;border:none;border-bottom:1px solid var(--paper-line);text-align:left;padding:11px 2px;}
  .tx-row-btn:hover{background:rgba(198,151,46,.06);}
  .tx-row-btn:focus-visible{outline:2px solid var(--gold-deep);outline-offset:-2px;}

  /* ---------- contact / sale info fields ---------- */
  .field-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 2px;border-bottom:1px solid var(--paper-line);font-size:12.5px;}
  .field-label{color:var(--muted);flex:none;}
  .field-value{color:var(--ink);text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;word-break:break-word;}
  .field-value a{color:var(--ink);text-decoration:none;border-bottom:1px dashed var(--gold-deep);}
  .field-value a:hover{color:var(--gold-deep);}
  .field-address{padding:8px 2px;border-bottom:1px solid var(--paper-line);font-size:12.5px;}
  .field-address .field-label{display:block;margin-bottom:3px;}
  .field-address .field-value{text-align:left;font-family:'Inter',sans-serif;font-size:12.5px;}
  .mask-btn{
    background:none;border:none;padding:0;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink);
    text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;
  }
  .mask-btn:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px;}

  /* ---------- cash flow: month picker + drill-down ---------- */
  .cf-select-wrap{position:relative;margin:2px 0 12px;}
  .cf-select{
    width:100%;appearance:none;-webkit-appearance:none;-moz-appearance:none;
    background:var(--paper);border:1px solid var(--paper-line);border-radius:12px;
    padding:13px 40px 13px 14px;font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;color:var(--ink);
  }
  .cf-select:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px;}
  .cf-select-wrap > svg{position:absolute;right:14px;top:50%;margin-top:-7px;pointer-events:none;color:var(--muted);}
  .cf-summary{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--paper-line);
    border:1px solid var(--paper-line);border-radius:12px;overflow:hidden;margin-bottom:4px;}
  .cf-tile{background:var(--paper);border:none;padding:14px;text-align:left;}
  .cf-tile:hover{background:rgba(198,151,46,.06);}
  .cf-tile:focus-visible{outline:2px solid var(--gold-deep);outline-offset:-2px;}
  .cf-tile-label{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;
  }
  .cf-tile-value{font-family:'Fraunces',serif;font-weight:600;font-size:16px;}
  .cf-tile-value.recv{color:var(--sage);}
  .cf-tile-value.due{color:var(--slate);}
  .month-chevron{transition:transform .15s ease;flex:none;color:var(--muted);}
  @media (prefers-reduced-motion: reduce){ .month-chevron{transition:none;} }
  .cf-tile[aria-expanded="true"] .month-chevron{transform:rotate(180deg);}
  .month-detail{padding:2px 2px 16px;}
  .task-note{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4;
  }
</style>
</head>

    var t = normName(s);
    t = t.replace(/^(MR|MRS|MS|MISS|MST|DR)\.?\s*/,'');
    return t.trim();
  }
  function maskId(v){
    var s = String(v||'');
    if (s.length <= 4) return '&bull;'.repeat(s.length) || '&mdash;';
    return '&bull;'.repeat(s.length - 4) + esc(s.slice(-4));
  }
  function cleanVal(v){
    var s = (v===null||v===undefined) ? '' : String(v).trim();
    if (!s || /^null$/i.test(s) || /^-+$/.test(s)) return '';
    return s;
  }
  function telHref(phone){
    var digits = phone.replace(/[^\d+]/g,'');
    if (digits.indexOf('+') !== 0 && /^0\d{9}$/.test(digits)) digits = '+971' + digits.slice(1);
    return 'tel:' + digits;
  }
  function waDigits(phone){
    var digits = phone.replace(/[^\d+]/g,'');
    if (digits.indexOf('+') === 0) return digits.slice(1);
    if (/^0\d{9}$/.test(digits)) return '971' + digits.slice(1);
    return digits;
  }
  function reminderMessage(c){

      var dueText;
      if (c.upDate){
        dueText = (c.upDate.getTime() < today.getTime()) ? (' was due on ' + fmtDate(c.upDate)) : (' is due on ' + fmtDate(c.upDate));
      } else {
        dueText = ' is due';
      }
      lines.push('This is a friendly reminder that a payment of ' + fmtAED(c.upAmt) + ' for ' + c.upStage + ' on unit ' + c.unit + dueText + '.');
    } else if (c.outstanding !== null && c.outstanding < -1){
      lines.push('This is a friendly reminder of an outstanding balance of ' + fmtAED(c.outstanding) + ' on unit ' + c.unit + '.');
    } else {

    }
    lines.push('Kindly arrange payment at your earliest convenience.');

    lines.push(brand);

  }

  function stageStatus(due, paid, dueDate, today){
    var tol = 5;
    if ((due === null || due === 0) && (paid === null || paid === 0)) return 'na';
    var p = paid || 0, d = due || 0;
    if (d > 0 && p >= d - tol) return 'paid';
    if (p > 0 && p < d - tol) return 'partial';
    if (dueDate) return dueDate.getTime() < today.getTime() ? 'overdue' : 'upcoming';
    return 'pending';
  }
  function paymentStatusLine(c){
    if (!c.upStage || c.upAmt === null){
      if (c.outstanding !== null && c.outstanding >= -1) return {text:'Fully paid', color:'var(--sage)', overdue:false};
      return null;
    }
    var today = new Date();
    var amtStr = fmtAED(c.upAmt);
    var isPast;
    if (c.upDate){
      isPast = c.upDate.getTime() < today.getTime();
    } else {
      // No due date given for this upcoming item (can happen when the source sheet
      // combines multiple overdue stages into one label) -- fall back to checking
      // the customer's own stage schedule for genuine overdue status.
      isPast = c.stages.some(function(s){ return stageStatus(s.due, s.paid, s.dueDate, today) === 'overdue'; });
    }
    var dateStr = c.upDate ? (' ' + fmtDate(c.upDate)) : '';
    if (isPast){
      return {text:c.upStage + ' \u2014 ' + amtStr + ' was due' + dateStr, color:'var(--rust)', overdue:true};
    }
    return {text:c.upStage + ' \u2014 ' + amtStr + ' is due' + dateStr, color:'var(--sage)', overdue:false};
  }

  /* ============ parsing ============ */
  function parseDuesRows(rawRows){
    var rows = rawRows.slice(1).filter(function(r){ return r[ROW.name] && String(r[ROW.name]).trim() !== ''; });
    return rows.map(function(r){
      var stages = STAGES.map(function(s){
        return {
          code:s.code, label:s.label,
          due:toNum(r[s.due]), dueDate:toDate(r[s.dueDate]),
          paid:toNum(r[s.paid]), paidDate:toDate(r[s.paidDate]),
          outAmt:toNum(r[s.out])
        };
      });
      var c = {
        sno:r[ROW.sno], name:(r[ROW.name]||'').toString().trim(), unit:(r[ROW.unit]||'').toString().trim(),
        type:(r[ROW.type]||'').toString().replace(/\n/g,' ').trim(),
        total:toNum(r[ROW.total]), received:toNum(r[ROW.received]), outstanding:toNum(r[ROW.outstanding]),
        spa:(r[ROW.spa]||'').toString().trim(), oqood:(r[ROW.oqood]||'').toString().trim(),
        furniture:(r[ROW.furniture]||'').toString().trim(),
        upStage:(r[ROW.upStage]||'').toString().trim(), upAmt:toNum(r[ROW.upAmt]), upDate:toDate(r[ROW.upDate]),
        action:(r[ROW.action]||'').toString().trim(), remarks:(r[ROW.remarks]||'').toString().trim(),
        updates:(r[ROW.updates]||'').toString().trim(), remarks2:(r[ROW.remarks2]||'').toString().trim(),
        stages: stages
      };

      // DLD + Admin Fees is always collected together with the 1st Installment in
      // practice. The source sheet's own "upcoming" fields sometimes reference only
      // the 1st Installment even when DLD is also still outstanding, which understates
      // what's actually due right now -- so fold DLD's remaining balance in here.
      if (c.upStage && /1st/i.test(c.upStage) && !/DLD/i.test(c.upStage)){
        var dldStage = stages.filter(function(s){ return s.code === 'DLD'; })[0];
        if (dldStage && dldStage.due !== null){
          var dldRemaining = (dldStage.due||0) - (dldStage.paid||0);
          if (dldRemaining > 1){
            c.upStage = c.upStage + ' + DLD';
            c.upAmt = (c.upAmt||0) + dldRemaining;
          }
        }
      }

      return c;
    });
  }
  function parseWorkbook(wb){
    var duesSheetName = wb.SheetNames.find(function(n){ return n.trim().toLowerCase() === 'payment dues'; });
    var recentSheetName = wb.SheetNames.find(function(n){ var t = n.trim().toLowerCase(); return t === 'recent payment' || t === 'transaction history'; });
    var cancelledSheetName = wb.SheetNames.find(function(n){ return n.trim().toLowerCase() === 'cancelled units'; });
    if (!duesSheetName) throw new Error("Couldn't find a \"Payment dues\" sheet in that workbook. Check you uploaded the right file.");

    var duesRaw = XLSX.utils.sheet_to_json(wb.Sheets[duesSheetName], {header:1, defval:null, blankrows:false});
    var dues = parseDuesRows(duesRaw);

    var cancelled = [];
    if (cancelledSheetName){
      var cancRaw = XLSX.utils.sheet_to_json(wb.Sheets[cancelledSheetName], {header:1, defval:null, blankrows:false});
      cancelled = parseDuesRows(cancRaw);
    }

    var recent = [];
    if (recentSheetName){
      var recRaw = XLSX.utils.sheet_to_json(wb.Sheets[recentSheetName], {header:1, defval:null, blankrows:false});
      var recRows = recRaw.slice(2).filter(function(r){ return r[RCOL.name] && String(r[RCOL.name]).trim() !== ''; });
      recent = recRows.map(function(r){
        var ref = (r[RCOL.ref]||'').toString().trim();
        return {
          name:(r[RCOL.name]||'').toString().trim(), unit:(r[RCOL.unit]||'').toString().trim(),
          date:toDate(r[RCOL.date]), towards:(r[RCOL.towards]||'').toString().replace(/\n/g,' ').trim(),
          amount:toNum(r[RCOL.amount]), paidBy:(r[RCOL.paidBy]||'').toString().trim(),
          ref: /^-+$/.test(ref) ? '' : ref,
          status:(r[RCOL.status]||'').toString().trim(), remark:(r[RCOL.remark]||'').toString().trim()
        };
      });
    }

    var infoSheetName = wb.SheetNames.find(function(n){ var t = n.trim().toLowerCase(); return t === 'customer info' || t === 'kyc'; });
    var infoMap = {};
    if (infoSheetName){
      var infoRaw = XLSX.utils.sheet_to_json(wb.Sheets[infoSheetName], {header:1, defval:null, blankrows:false});
      var infoRows = infoRaw.slice(1).filter(function(r){ return r[KYC.unit] && String(r[KYC.unit]).trim() !== ''; });
      infoRows.forEach(function(r){
        var key = normUnit(r[KYC.unit]);
        if (!key) return;
        var permAddr = cleanVal(r[KYC.permanentAddress]);
        if (permAddr && /same as/i.test(permAddr)) permAddr = '';
        infoMap[key] = {
          phone:cleanVal(r[KYC.phone]), email:cleanVal(r[KYC.email]),
          address:cleanVal(r[KYC.address]), permanentAddress:permAddr,
          nationality:cleanVal(r[KYC.nationality]), designation:cleanVal(r[KYC.designation]),
          dob:toDate(r[KYC.dob]),
          passport:cleanVal(r[KYC.passport]), eid:cleanVal(r[KYC.eid]),
          floor:cleanVal(r[KYC.floor]), pricePerSqft:cleanVal(r[KYC.pricePerSqft]), area:cleanVal(r[KYC.area]),
          soldBy:cleanVal(r[KYC.soldBy]), source:cleanVal(r[KYC.source]),
          brokerName:cleanVal(r[KYC.brokerName]), brokerCompany:cleanVal(r[KYC.brokerCompany]),
          brokeragePct:toNum(r[KYC.brokeragePct]), brokerageAmt:toNum(r[KYC.brokerageAmt]),
          bookingDate:toDate(r[KYC.bookingDate]), bookingAmt:toNum(r[KYC.bookingAmt]),
          coApplicant:cleanVal(r[KYC.coApplicant]), kycRemarks:cleanVal(r[KYC.kycRemarks])
        };
      });
      dues.forEach(function(c){ c.info = infoMap[normUnit(c.unit)] || null; });
    } else {
      dues.forEach(function(c){ c.info = null; });
    }

    return {dues:dues, recent:recent, cancelled:cancelled};
  }

  function matchTransactions(customer){
    var cn = normName(customer.name);
    var cu = normUnit(customer.unit);
    // if this name owns more than one unit, also require the unit to match so their
    // transactions don't get attributed to every unit they own.
    var sameNameCount = state.dues.filter(function(d){ return normName(d.name) === cn; }).length;
    return state.recent.filter(function(t){
      var tn = normName(t.name);
      if (!tn || tn.length < 3) return false;
      var nameMatches = tn === cn || cn.indexOf(tn) !== -1 || tn.indexOf(cn) !== -1;
      if (!nameMatches) return false;
      if (sameNameCount > 1){
        var tu = normUnit(t.unit);
        return !!tu && !!cu && tu === cu;
      }
      return true;
    }).sort(function(a,b){
      if (!a.date && !b.date) return 0;
      if (!a.date) return 1;
      if (!b.date) return -1;
      return a.date - b.date;
    });
  }
  function isNewCustomer(c){
    // Two signals, both required: few/no logged transactions, AND nothing paid
    // beyond the Down Payment stage. The transaction log alone can under-report
    // older customers (payments recorded before logging began), so checking actual
    // stage-level payment guards against mistakenly treating a long-standing,
    // under-logged customer as brand new.
    var dp = c.stages.filter(function(s){ return s.code === 'DP'; })[0];
    var dpPaid = dp ? (dp.paid||0) : 0;
    var beyondDp = (c.received||0) - dpPaid;
    return matchTransactions(c).length <= 1 && beyondDp <= 1;
  }

  /* ============ derived / aggregate ============ */
  function unitTypeKey(c){
    var m = (c.type||'').match(/(\d+)\s*BR/i);
    return m ? (m[1] + 'BR') : 'Other';
  }
  function customerDerived(c, today){
    var overdueCount = 0;
    c.stages.forEach(function(s){
      var st = stageStatus(s.due, s.paid, s.dueDate, today);
      if (st === 'overdue') overdueCount++;
    });
    return {overdueCount:overdueCount};
  }
  function customerOverdueInfo(c){
    var today = new Date();
    var maxDays = 0, totalOverdueAmt = 0, earliestDueDate = null, stageLabels = [];
    c.stages.forEach(function(s){
      if (stageStatus(s.due, s.paid, s.dueDate, today) === 'overdue'){
        var days = Math.floor((today - s.dueDate) / 86400000);
        if (days > maxDays) maxDays = days;
        totalOverdueAmt += (s.due - (s.paid||0));
        stageLabels.push(s.label);
        if (!earliestDueDate || s.dueDate.getTime() < earliestDueDate.getTime()) earliestDueDate = s.dueDate;
      }
    });
    return {
      isOverdue: maxDays > 0, daysOverdue: maxDays, overdueAmount: totalOverdueAmt,
      earliestDueDate: earliestDueDate, stageLabels: stageLabels,
      eligibleForDemandLetter: maxDays >= 3, eligibleForLateCharge: maxDays >= 7
    };
  }
  function calculateLateCharge(overdueAmount, daysOverdue){
    var monthlyRatePct = 1; // 1% per month
    var charge = overdueAmount * (monthlyRatePct/100) * (daysOverdue / 30);
    return Math.round(charge * 100) / 100;
  }
  function customerComplianceTiming(c){
    // Business rule: SPA is expected to be signed 10 days after Down Payment + 1st
    // Installment + DLD/Admin Fees (24% of value) are all fully paid. OQOOD cannot
    // complete before SPA is signed, and is expected 15 days after that signing.
    // The workbook only records current SPA/OQOOD status, not the date each changed,
    // so the SPA-signed date used for the OQOOD estimate below is itself an estimate
    // (the expected SPA date) rather than an actual recorded signing date.
    var result = {reached24pct:false, completionDate:null, expectedSpaDate:null, spaIsOverdue:false, spaOverdueDays:0, oqoodExpectedDate:null, oqoodIsOverdue:false, oqoodOverdueDays:0};
    var dp = c.stages.filter(function(s){ return s.code === 'DP'; })[0];
    var inst1 = c.stages.filter(function(s){ return s.code === '1ST'; })[0];
    var dld = c.stages.filter(function(s){ return s.code === 'DLD'; })[0];
    function isPaid(s){ return s && s.due !== null && (s.paid||0) >= s.due - 1 && s.paidDate; }
    if (!isPaid(dp) || !isPaid(inst1) || !isPaid(dld)) return result;

    result.reached24pct = true;
    var latest = new Date(Math.max(dp.paidDate.getTime(), inst1.paidDate.getTime(), dld.paidDate.getTime()));
    result.completionDate = latest;
    var expectedSpa = new Date(latest.getTime() + 10*86400000);
    result.expectedSpaDate = expectedSpa;

    var today = new Date();
    var spaSigned = (c.spa||'').toLowerCase() === 'signed';
    if (!spaSigned && today.getTime() > expectedSpa.getTime()){
      result.spaIsOverdue = true;
      result.spaOverdueDays = Math.floor((today - expectedSpa) / 86400000);
    }

    if (spaSigned){
      var oqoodExpected = new Date(expectedSpa.getTime() + 15*86400000); // estimate -- see note above
      result.oqoodExpectedDate = oqoodExpected;
      var oqoodDone = (c.oqood||'').toLowerCase() === 'completed';
      if (!oqoodDone && today.getTime() > oqoodExpected.getTime()){
        result.oqoodIsOverdue = true;
        result.oqoodOverdueDays = Math.floor((today - oqoodExpected) / 86400000);
      }
    }
    return result;
  }

  function portfolioStats(){
    var totalSales = 0, totalReceived = 0, totalOutstanding = 0;
    var spaCounts = {signed:0, drafted:0, none:0};
    var oqoodCounts = {completed:0, pending:0, other:0, none:0};
    var furnitureCounts = {furnished:0, unfurnished:0};
    var mixMap = {};
    var stageAgg = STAGES.map(function(s){ return {label:s.label, count:0, due:0, received:0}; });
    var today = new Date();
    var overdueAmount = 0, overdueUnits = 0;

    state.dues.forEach(function(c){
      totalSales += (c.total||0);
      totalReceived += (c.received||0);
      totalOutstanding += (c.outstanding||0);

      var spa = (c.spa||'').toLowerCase();
      if (spa === 'signed') spaCounts.signed++;
      else if (spa === 'drafted') spaCounts.drafted++;
      else spaCounts.none++;

      var oq = (c.oqood||'').toLowerCase();
      if (oq === 'completed') oqoodCounts.completed++;
      else if (oq === 'pending') oqoodCounts.pending++;
      else if (oq) oqoodCounts.other++;
      else oqoodCounts.none++;

      if ((c.furniture||'').toLowerCase() === 'signed') furnitureCounts.furnished++;
      else furnitureCounts.unfurnished++;

      var key = unitTypeKey(c);
      if (!mixMap[key]) mixMap[key] = {label:key, count:0, value:0};
      mixMap[key].count++;
      mixMap[key].value += (c.total||0);

      var hasOverdue = false;
      c.stages.forEach(function(s, i){
        if (s.due !== null){
          stageAgg[i].count++;
          stageAgg[i].due += s.due;
          stageAgg[i].received += (s.paid||0);
          if (stageStatus(s.due, s.paid, s.dueDate, today) === 'overdue'){
            overdueAmount += (s.due - (s.paid||0));
            hasOverdue = true;
          }
        }
      });
      if (hasOverdue) overdueUnits++;
    });

    var mix = Object.keys(mixMap).map(function(k){ return mixMap[k]; })
      .sort(function(a,b){ return a.label.localeCompare(b.label, undefined, {numeric:true}); });

    var stageBreakdown = stageAgg.map(function(s){
      return {label:s.label, count:s.count, due:s.due, received:s.received, balance:s.received - s.due};
    });

    var withOutstanding = state.dues.slice().sort(function(a,b){
      var ao = a.outstanding===null?0:a.outstanding, bo = b.outstanding===null?0:b.outstanding;
      return ao - bo;
    });
    var topAtRisk = withOutstanding.filter(function(c){ return c.outstanding !== null && c.outstanding < -1; }).slice(0,8);

    var activity = [];
    state.dues.forEach(function(c){
      matchTransactions(c).forEach(function(t){
        activity.push({date:t.date, name:c.name, unit:c.unit, sno:c.sno, towards:t.towards, amount:t.amount});
      });
    });
    activity.sort(function(a,b){
      if (!a.date && !b.date) return 0;
      if (!a.date) return 1;
      if (!b.date) return -1;
      return b.date - a.date;
    });

    var collectedPct = totalSales > 0 ? Math.round((totalReceived/totalSales)*1000)/10 : 0;
    var outstandingPct = totalSales > 0 ? Math.round((Math.abs(totalOutstanding)/totalSales)*1000)/10 : 0;

    return {
      units:state.dues.length, totalSales:totalSales, totalReceived:totalReceived, totalOutstanding:totalOutstanding,
      collectedPct:collectedPct, outstandingPct:outstandingPct,
      spaCounts:spaCounts, oqoodCounts:oqoodCounts, furnitureCounts:furnitureCounts, mix:mix, stageBreakdown:stageBreakdown,
      topAtRisk:topAtRisk, recentActivity:activity.slice(0,10),
      overdueAmount:overdueAmount, overdueUnits:overdueUnits
    };
  }

  function customerDldStatus(c){
    var dld = c.stages.filter(function(s){ return s.code === 'DLD'; })[0];
    if (!dld || dld.due === null) return null;
    var paid = dld.paid || 0;
    var remaining = dld.due - paid;
    if (remaining <= 1) return 'paid';
    if (paid > 0) return 'partial';
    return 'notstarted';
  }
  function dldFeeTracker(){
    var today = new Date();
    var totalDue = 0, totalPaid = 0, totalOutstanding = 0;
    var fullyPaid = 0, partiallyPaid = 0, notStarted = 0;
    var overdueCount = 0, overdueAmount = 0;
    var customersWithDld = 0;
    state.dues.forEach(function(c){
      var dld = c.stages.filter(function(s){ return s.code === 'DLD'; })[0];
      if (!dld || dld.due === null) return;
      customersWithDld++;
      totalDue += dld.due;
      var paid = dld.paid || 0;
      totalPaid += paid;
      var remaining = dld.due - paid;
      totalOutstanding += Math.max(0, remaining);
      if (remaining <= 1) fullyPaid++;
      else if (paid > 0) partiallyPaid++;
      else notStarted++;
      if (stageStatus(dld.due, dld.paid, dld.dueDate, today) === 'overdue'){
        overdueCount++;
        overdueAmount += remaining;
      }
    });
    return {
      any: customersWithDld > 0, customersWithDld: customersWithDld,
      totalDue: totalDue, totalPaid: totalPaid, totalOutstanding: totalOutstanding,
      collectedPct: totalDue > 0 ? Math.round((totalPaid/totalDue)*1000)/10 : 0,
      fullyPaid: fullyPaid, partiallyPaid: partiallyPaid, notStarted: notStarted,
      overdueCount: overdueCount, overdueAmount: overdueAmount
    };
  }
  function overdueAging(){
    var today = new Date();
    var buckets = [
      {key:'b0_30', label:'1\u201330 days', amount:0, count:0, color:'var(--amber)'},
      {key:'b31_60', label:'31\u201360 days', amount:0, count:0, color:'#C2790E'},
      {key:'b61_90', label:'61\u201390 days', amount:0, count:0, color:'#B0552A'},
      {key:'b90p', label:'90+ days', amount:0, count:0, color:'var(--rust)'}
    ];
    var byKey = {};
    buckets.forEach(function(b){ byKey[b.key] = b; });
    state.dues.forEach(function(c){
      c.stages.forEach(function(s){
        if (!s.dueDate || s.due === null) return;
        var remaining = s.due - (s.paid || 0);
        if (remaining <= 5) return;
        if (s.dueDate.getTime() >= today.getTime()) return;
        var days = Math.floor((today - s.dueDate) / 86400000);
        var key = days <= 30 ? 'b0_30' : days <= 60 ? 'b31_60' : days <= 90 ? 'b61_90' : 'b90p';
        byKey[key].amount += remaining;
        byKey[key].count++;
      });
    });
    var total = buckets.reduce(function(sum,b){ return sum + b.amount; }, 0);
    return {buckets:buckets, total:total};
  }
  function brokerPerformance(){
    var map = {};
    var directCount = 0, directValue = 0, brokerCount = 0, brokerValue = 0;
    var hasInfo = false;
    state.dues.forEach(function(c){
      var info = c.info;
      if (info) hasInfo = true;
      var brokerName = info && info.brokerName;
      if (brokerName){
        brokerCount++; brokerValue += (c.total||0);
        var nameKey = normPersonName(brokerName);
        var companyKey = normName(info.brokerCompany||'');
        var key = nameKey + '|' + companyKey;
        if (!map[key]) map[key] = {name:titleCase(nameKey), company:info.brokerCompany||'', units:0, value:0, received:0};
        map[key].units++;
        map[key].value += (c.total||0);
        map[key].received += (c.received||0);
      } else {
        directCount++; directValue += (c.total||0);
      }
    });
    var brokers = Object.keys(map).map(function(k){
      var b = map[k];
      b.pct = b.value > 0 ? Math.round((b.received/b.value)*1000)/10 : 0;
      return b;
    }).sort(function(a,b){ return b.value - a.value; });
    return {hasInfo:hasInfo, brokers:brokers, directCount:directCount, directValue:directValue, brokerCount:brokerCount, brokerValue:brokerValue};
  }

  function thisMonthSummary(){

  function topOverdueAccounts(limit){

      c.stages.forEach(function(s){

  function salesVelocity(){
    var months = {};
    var any = false;
    state.dues.forEach(function(c){
      var info = c.info;
      if (!info || !info.bookingDate) return;
      any = true;
      var key = monthKey(info.bookingDate);
      if (!months[key]) months[key] = {key:key, count:0, value:0};
      months[key].count++;
      months[key].value += (c.total||0);
    });
    var keys = Object.keys(months).sort();
    var list = keys.map(function(k){ return months[k]; });
    list.forEach(function(m, i){
      if (i === 0){ m.growthPct = null; return; }
      var prev = list[i-1].value;
      m.growthPct = prev > 0 ? Math.round(((m.value - prev) / prev) * 1000) / 10 : null;
    });
    return {any:any, months:list};

  function followUpTasks(){
    var buckets = {
      urgent:{key:'urgent', label:'Urgent Follow-up', color:'var(--rust)', items:[]},
      other:{key:'other', label:'Other', color:'var(--muted)', items:[]}
    };
    state.dues.forEach(function(c){
      var parsed = parseAction(c.action);
      if (parsed.type === 'done' || parsed.type === 'none' || parsed.type === 'demand' || parsed.type === 'reminder') return;
      var bucket = buckets[parsed.type];
      if (!bucket) return;
      bucket.items.push({
        unit:c.unit, sno:c.sno, name:c.name, action:c.action, actionDate:parsed.date,
        updates:c.updates, remarks:c.remarks, remarks2:c.remarks2
      });
    });
    Object.keys(buckets).forEach(function(k){
      buckets[k].items.sort(function(a,b){
        if (a.actionDate && b.actionDate) return a.actionDate - b.actionDate;
        if (a.actionDate) return -1;
        if (b.actionDate) return 1;
        return a.name.localeCompare(b.name);
      });
    });
    return Object.keys(buckets).map(function(k){ return buckets[k]; }).filter(function(b){ return b.items.length > 0; });
  }

  function cashFlowByMonth(){
    var today = new Date();
    var todayKey = monthKey(today);
    var months = {};
    function ensure(key){
      if (!months[key]) months[key] = {key:key, received:0, due:0, receivedTx:[], dueItems:[]};
      return months[key];
    }
    state.dues.forEach(function(c){
      matchTransactions(c).forEach(function(t){
        if (!t.date || t.amount === null) return;
        var key = monthKey(t.date);
        var m = ensure(key);
        m.received += t.amount;
        m.receivedTx.push({date:t.date, name:c.name, unit:c.unit, sno:c.sno, towards:t.towards, amount:t.amount});
      });
      c.stages.forEach(function(s){
        if (!s.dueDate || s.due === null) return;
        var key = monthKey(s.dueDate);
        if (key < todayKey) return; // overdue-from-past-months surfaces elsewhere, not here
        var remaining = s.due - (s.paid || 0);
        if (remaining <= 5) return;
        var m = ensure(key);
        m.due += remaining;
        m.dueItems.push({name:c.name, unit:c.unit, sno:c.sno, label:s.label, amount:remaining, dueDate:s.dueDate});
      });
    });
    var keys = Object.keys(months).sort();
    var list = keys.map(function(k){
      var m = months[k];
      m.receivedTx.sort(function(a,b){ return a.date - b.date; });
      m.dueItems.sort(function(a,b){ return a.dueDate - b.dueDate; });
      return m;
    });
    return {months:list, todayKey:todayKey};
  }

  function resizeImageFile(file, maxHeight){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var scale = Math.min(1, maxHeight / img.height);
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = function(){ reject(new Error('Could not read that image.')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('Could not read that file.')); };
      reader.readAsDataURL(file);
    });
  }
  function pdfFileToDataURL(file, maxHeight){
    if (!window.pdfjsLib){
      return Promise.reject(new Error('PDF reader did not load — check your connection and try again.'));
    }
    if (pdfjsLib.GlobalWorkerOptions && !pdfjsLib.GlobalWorkerOptions.workerSrc){
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    return file.arrayBuffer().then(function(buf){
      return pdfjsLib.getDocument({data:buf}).promise;
    }).then(function(pdf){
      return pdf.getPage(1);
    }).then(function(page){
      var base = page.getViewport({scale:1});
      var scale = Math.min(3, Math.max(0.5, maxHeight / base.height));
      var viewport = page.getViewport({scale:scale});
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(viewport.width);
      canvas.height = Math.round(viewport.height);
      var ctx = canvas.getContext('2d');
      return page.render({canvasContext:ctx, viewport:viewport}).promise.then(function(){
        return canvas.toDataURL('image/png');
      });
    }).catch(function(err){
      throw new Error('Could not read that PDF (only the first page is used).');
    });
  }

      var color = isLast ? '#C6972E' : '#3F7A57';
      return (m.value > 0 ? '<text x="' + (x + barW/2).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle" font-family="' + CHART_MONO + '" font-size="9" fill="#444">' + esc(fmtCompact(m.value)) + '</text>' : '') +
        '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + barH.toFixed(1) + '" rx="2.5" fill="' + color + '"/>' +
        '<text x="' + (x + barW/2).toFixed(1) + '" y="' + (chartBottom + 15) + '" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#666">' + esc(mLbl) + '</text>';
    }).join('');
    return '<svg width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + ' ' + height + '">' +
      gridLines + bars +
      '<line x1="' + padLeft + '" y1="' + chartBottom + '" x2="' + (width-padRight) + '" y2="' + chartBottom + '" stroke="#bbb" stroke-width="1"/>' +
    '</svg>';
  }
  function svgStageRateChart(stages, opts){
    opts = opts || {};
    var width = opts.width || 520, barH = opts.barH || 16, gap = opts.gap || 12;
    var labelW = opts.labelW || 132, valueW = opts.valueW || 56;
    var barAreaW = width - labelW - valueW;
    var padTop = 18;
    var rowH = barH + gap;
    function colorFor(pct){
      if (pct === null) return '#c7bd9f';
      if (pct >= 80) return '#3F7A57';
      if (pct >= 40) return '#B4842A';
      return '#AE3B2B';
    }
    var gridLines = [0,25,50,75,100].map(function(g){
      var x = labelW + (g/100) * barAreaW;
      return '<line x1="' + x.toFixed(1) + '" y1="' + (padTop-6) + '" x2="' + x.toFixed(1) + '" y2="' + (padTop + stages.length*rowH - gap + 4) + '" stroke="#eee2c9" stroke-width="1"/>' +
        '<text x="' + x.toFixed(1) + '" y="12" text-anchor="middle" font-family="' + CHART_MONO + '" font-size="8" fill="#999">' + g + '%</text>';
    }).join('');
    var bars = stages.map(function(s, i){
      var pct = s.due > 0 ? Math.max(0, Math.min(100, (s.received/s.due)*100)) : null;
      var y = padTop + i * rowH;
      var w = pct === null ? 0 : (pct/100) * barAreaW;
      var c = colorFor(pct);
      return '<text x="0" y="' + (y + barH/2 + 3.5) + '" font-family="Inter, sans-serif" font-size="10.5" fill="#333">' + esc(s.label) + '</text>' +
        '<rect x="' + labelW + '" y="' + y + '" width="' + barAreaW + '" height="' + barH + '" rx="3" fill="#f5f0e2"/>' +
        (pct !== null ? '<rect x="' + labelW + '" y="' + y + '" width="' + Math.max(w,3).toFixed(1) + '" height="' + barH + '" rx="3" fill="' + c + '"/>' : '') +
        '<text x="' + (labelW + barAreaW + 10) + '" y="' + (y + barH/2 + 3.5) + '" font-family="' + CHART_MONO + '" font-size="10.5" font-weight="600" fill="#222">' + (pct === null ? '\u2014' : Math.round(pct) + '%') + '</text>';
    }).join('');
    var height = padTop + stages.length * rowH - gap + 8;
    return '<svg width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + ' ' + height + '">' + gridLines + bars + '</svg>';
  }
  function detectConcentration(cf, k){
    var upcoming = cf.months.filter(function(m){ return m.key >= cf.todayKey && m.due > 0; });
    if (upcoming.length < 2) return null;
    var vals = upcoming.map(function(m){ return m.due; });
    var maxVal = Math.max.apply(null, vals);
    var maxMonth = upcoming.filter(function(m){ return m.due === maxVal; })[0];
    var othersSum = vals.reduce(function(a,b){ return a+b; }, 0) - maxVal;
    var othersAvg = othersSum / Math.max(1, vals.length - 1);
    if (othersAvg > 0 && maxVal > othersAvg * 3){
      var totalOutstanding = Math.abs(k.totalOutstanding);
      var pct = totalOutstanding > 0 ? Math.round((maxVal/totalOutstanding)*100) : 0;
      return {monthLabel: monthLabel(maxMonth.key), amount: maxVal, pct: pct};
    }
    return null;
  }
  function detectChannelDependency(k, bp){
    if (!bp.hasInfo || !bp.brokers.length || k.totalSales <= 0) return null;
    var top = bp.brokers[0];
    var pct = Math.round((top.value / k.totalSales) * 100);
    if (pct >= 25){
      return {
        title: 'Broker concentration',
        text: titleCase(top.name) + (top.company ? ' (' + titleCase(top.company) + ')' : '') + ' accounts for ' + pct + '% of total sales value (AED ' + fmtCompact(top.value) + '). Worth diversifying broker relationships to reduce single-channel dependency.'
      };
    }
    return null;
  }
  function detectBrokerUnderperformance(k, bp){
    if (!bp.hasInfo || !bp.brokers.length) return null;
    var overallPct = k.collectedPct;
    var worst = null, worstGap = 0;
    bp.brokers.forEach(function(b){
      if (b.units < 3) return; // avoid noise from tiny sample sizes
      var gap = overallPct - b.pct;
      if (gap >= 15 && gap > worstGap){ worst = b; worstGap = gap; }
    });
    if (worst){
      return {
        title: 'Broker collection lag',
        text: titleCase(worst.name) + (worst.company ? ' (' + titleCase(worst.company) + ')' : '') + '\u2019s customers are collecting at ' + worst.pct + '%, ' + Math.round(worstGap) + ' points below the portfolio average of ' + overallPct + '%, across ' + worst.units + ' units. May be worth a closer look at this relationship.'
      };
    }
    return null;
  }
  function detectComplianceBacklog(){
    var stale = 0, staleValue = 0;
    state.dues.forEach(function(c){
      var timing = customerComplianceTiming(c);
      if (timing.spaIsOverdue){
        stale++;
        staleValue += (c.total||0);
      }
    });
    if (stale >= 1){
      return {
        title: 'SPA signing behind schedule',
        text: stale + ' unit' + (stale===1?'':'s') + ' passed 24% payment completion (Down Payment + 1st Installment + DLD, all paid) more than 10 days ago but still don\u2019t have SPA signed, representing AED ' + fmtCompact(staleValue) + ' in contracted value.'
      };
    }
    return null;
  }
  function detectCancellationRate(k, cs){
    var totalEverSold = k.units + cs.count;
    if (!totalEverSold || !cs.count) return null;
    var pct = (cs.count / totalEverSold) * 100;
    if (pct >= 3){
      return {
        title: 'Cancellation rate',
        text: cs.count + ' of ' + totalEverSold + ' units sold (' + (Math.round(pct*10)/10) + '%) have been cancelled, representing AED ' + fmtCompact(cs.totalValue) + ' in lost contracted value.'
      };
    }
    return null;
  }
  function generateInsights(){
    var k = portfolioStats();
    var cf = cashFlowByMonth();
    var bp = brokerPerformance();
    var cs = cancelledStats();
    var insights = [];

    var concentration = detectConcentration(cf, k);
    if (concentration){
      insights.push({
        title: 'Concentration risk ahead',
        text: 'AED ' + fmtCompact(concentration.amount) + ' (' + concentration.pct + '% of total outstanding) falls due in ' + concentration.monthLabel + ', concentrated in final handover payments. Recommend planning collections resourcing and customer communications ahead of that date.'
      });
    }
    var dep = detectChannelDependency(k, bp);
    if (dep) insights.push(dep);
    var lag = detectBrokerUnderperformance(k, bp);
    if (lag) insights.push(lag);
    var backlog = detectComplianceBacklog();
    if (backlog) insights.push(backlog);
    var cancelRate = detectCancellationRate(k, cs);
    if (cancelRate) insights.push(cancelRate);

    return insights;
  }

      body += '<p class="chart-caption">Share of each installment stage collected so far. Green &ge;80%, amber 40&ndash;79%, red &lt;40%.</p>';
      body += svgStageRateChart(k.stageBreakdown, {width:520});
    }

    if (rs.dldTracker){
      var dld = dldFeeTracker();
      if (dld.any){
        body += '<h2>DLD &amp; Registration Fee Tracker</h2>';
        body += '<div class="print-summary-grid">' +
          printSummaryItem('Collected', 'AED ' + fmtCompact(dld.totalPaid) + ' (' + dld.collectedPct + '%)') +
          printSummaryItem('Outstanding', 'AED ' + fmtCompact(dld.totalOutstanding)) +
          printSummaryItem('Fully Paid', dld.fullyPaid + ' units') +
          printSummaryItem('Overdue', dld.overdueCount + ' units \u00b7 AED ' + fmtCompact(dld.overdueAmount)) +
        '</div>';
      }
    }

    if (rs.collectionsRisk){
      body += '<h2>Collections Risk</h2>';
      body += '<div class="print-summary-grid">' +
        printSummaryItem('Currently Overdue', 'AED ' + fmtCompact(k.overdueAmount)) +
        printSummaryItem('Units Overdue', k.overdueUnits) +
      '</div>';

      var aging = overdueAging();
      if (aging.total > 0){
        body += '<h2>Overdue Aging</h2>';
        body += '<table><thead><tr><th>Age</th><th>Amount</th><th>Installments</th></tr></thead><tbody>';
        aging.buckets.forEach(function(b){
          body += '<tr><td>' + esc(b.label) + '</td><td>' + fmtAED(b.amount) + '</td><td>' + b.count + '</td></tr>';
        });
        body += '</tbody></table>';
      }
    }

    if (rs.cancelledUnits){
      var cs = cancelledStats();
      if (cs.count > 0){
        body += '<h2>Cancelled Units</h2>';
        body += '<div class="print-summary-grid">' +
          printSummaryItem('Cancelled', cs.count) +
          printSummaryItem('Value Lost', 'AED ' + fmtCompact(cs.totalValue)) +
          printSummaryItem('Received Before', 'AED ' + fmtCompact(cs.totalReceived)) +
        '</div>';
        body += '<table><thead><tr><th>Unit</th><th>Customer</th><th>Received</th></tr></thead><tbody>';
        cs.units.forEach(function(c){
          body += '<tr><td>' + esc(c.unit) + '</td><td>' + esc(titleCase(c.name)) + '</td><td>' + fmtAED(c.received) + '</td></tr>';
        });
        body += '</tbody></table>';
      }
    }

    if (rs.brokerPerf){
      var bp = brokerPerformance();
      if (bp.hasInfo){
        body += '<h2>Sales Channel</h2>';
        body += '<div class="print-summary-grid">' +
          printSummaryItem('Direct', bp.directCount + ' units \u00b7 AED ' + fmtCompact(bp.directValue)) +
          printSummaryItem('Broker', bp.brokerCount + ' units \u00b7 AED ' + fmtCompact(bp.brokerValue)) +
        '</div>';
        if (bp.brokers.length){
          var topN = 10;
          body += '<h2>Broker Performance' + (bp.brokers.length > topN ? ' &middot; Top ' + topN + ' by Value' : '') + '</h2>';
          body += '<table><thead><tr><th>Broker</th><th>Units</th><th>Value</th><th>Collected</th></tr></thead><tbody>';
          bp.brokers.slice(0, topN).forEach(function(b){
            body += '<tr><td>' + esc(titleCase(b.name)) + (b.company ? ' <span style="color:#888">(' + esc(titleCase(b.company)) + ')</span>' : '') + '</td><td>' + b.units + '</td><td>' + fmtCompact(b.value) + '</td><td>' + b.pct + '%</td></tr>';
          });
          body += '</tbody></table>';
          if (bp.brokers.length > topN){
            body += '<p class="chart-caption">+ ' + (bp.brokers.length - topN) + ' more brokers &mdash; see the Insights tab for the full list.</p>';
          }
        }
      }
    }

    if (rs.salesVelocity){
      var sv = salesVelocity();
      if (sv.any && sv.months.length){
        var svMonths = sv.months.slice(-8);
        body += '<h2>Monthly Sales Value</h2>';
        body += '<p class="chart-caption">Units sold by booking date, most recent months.</p>';
        body += svgValueTrendChart(svMonths, {width:520, height:180});
        body += '<table><thead><tr><th>Month</th><th>Units</th><th>Value</th><th>Value Growth %</th></tr></thead><tbody>';
        svMonths.forEach(function(m){
          body += '<tr><td>' + esc(monthLabel(m.key)) + '</td><td>' + m.count + '</td><td>AED ' + fmtCompact(m.value) + '</td><td>' + (m.growthPct === null ? '\u2014' : (m.growthPct >= 0 ? '+' : '') + m.growthPct + '%') + '</td></tr>';
        });
        body += '</tbody></table>';
      }
    }

    body += '<div class="print-footer">Confidential &mdash; Internal Use Only. Generated ' + fmtDate(today) + '.</div>';
    return {title:'Executive Summary Report', body:body};
  }

  function wireBrandEditor(){
    var letterheadInput = document.getElementById('brandLetterheadInput');
    if (letterheadInput){
      letterheadInput.addEventListener('change', function(e){
        var file = e.target.files[0];
        if (!file) return;
        var isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
        var task = isPdf ? pdfFileToDataURL(file, 2000) : resizeImageFile(file, 2000);
        task.then(function(dataUrl){
          state.branding.letterhead = dataUrl;
          state.brandError = null;
          render();
        }).catch(function(err){
          state.brandError = err && err.message ? err.message : 'Could not read that file.';
          render();
        });
      });
    }
    var letterheadRemove = document.getElementById('brandLetterheadRemove');
    if (letterheadRemove){
      letterheadRemove.addEventListener('click', function(){
        state.branding.letterhead = null;
        render();
      });
    }
    document.getElementById('brandSave').addEventListener('click', async function(){
      var nameVal = document.getElementById('brandName').value.trim();
      var taglineVal = document.getElementById('brandTagline').value.trim();
      state.branding.name = nameVal || 'Sunbliss Residences';
      state.branding.tagline = taglineVal;
      var lhTopEl = document.getElementById('brandLhTop');
      var lhBottomEl = document.getElementById('brandLhBottom');
      if (lhTopEl) state.branding.lhTop = Math.max(0, parseInt(lhTopEl.value, 10) || 0);
      if (lhBottomEl) state.branding.lhBottom = Math.max(0, parseInt(lhBottomEl.value, 10) || 0);
      state.branding.collectionsContact = document.getElementById('brandCollectionsContact').value.trim();
      state.branding.crmEmail = document.getElementById('brandCrmEmail').value.trim();
      state.branding.managerName = document.getElementById('brandManagerName').value.trim();

      state.brandEditing = false;
      state.brandError = null;
      saveBranding();
      render();
    });
    document.getElementById('brandCancel').addEventListener('click', function(){
      if (state.brandEditingBackup) state.branding = state.brandEditingBackup;
      state.brandEditing = false;
      state.brandError = null;
      render();
    });
  }

  function statCell(label, value, sub, id, trend){
    var tag = id ? 'button' : 'div';
    var idAttr = id ? ' id="' + id + '"' : '';
    var cls = id ? 'stat-cell clickable' : 'stat-cell';
    var trendHtml = trend ? ' <span style="color:' + trend.color + ';font-weight:700;">' + trend.arrow + ' ' + esc(trend.text) + '</span>' : '';
    return '<' + tag + ' class="' + cls + '"' + idAttr + '><p class="stat-label">' + label + '</p><p class="stat-value">' + value + '</p>' + (sub || trend ? '<p class="stat-sub">' + (sub||'') + trendHtml + '</p>' : '') + '</' + tag + '>';
  }
  function computeTrend(current, previous, higherIsBetter, formatDiff){
    if (previous === null || previous === undefined) return null;
    var diff = current - previous;
    if (Math.abs(diff) < 0.05) return null; // negligible, don't clutter the card
    var isUp = diff > 0;
    var good = higherIsBetter ? isUp : !isUp;
    return {
      arrow: isUp ? '\u25b2' : '\u25bc',
      color: good ? 'var(--sage)' : 'var(--rust)',
      text: formatDiff(diff) + ' vs last upload'
    };
  }
  function pillStat(num, label, color, id){
    var tag = id ? 'button' : 'div';
    var idAttr = id ? ' id="' + id + '"' : '';
    var cls = id ? 'pill-stat clickable' : 'pill-stat';
    return '<' + tag + ' class="' + cls + '"' + idAttr + '><p class="pill-stat-num"><span class="pill-dot" style="background:' + color + '"></span>' + num + '</p><p class="pill-stat-lbl">' + label + '</p></' + tag + '>';
  }
  function cfTile(label, amount, key, count){

      '<p class="cf-tile-label"><span>' + label + '</span>' + chevronIcon() + '</p>' +
      '<p class="cf-tile-value ' + key + '">' + (amount > 0 ? fmtAED(amount) : '&mdash;') + '</p>' +
      (count ? '<p class="stat-sub">' + count + ' ' + (count === 1 ? 'entry' : 'entries') + '</p>' : '') +
    '</button>';
  }

  function renderOverview(){
    var k = portfolioStats();

    var html = renderTabs('overview');
    html += '<div class="overview">';
    if (state.reportPickerOpen){
      html += renderReportPicker();
    } else {
      html += '<button class="btn-paper" id="btnPrintReport">' + printIcon() + 'Print executive summary report</button>';
    }

    var prevSnap = state.prevSnapshot;
    var trendUnits = prevSnap ? computeTrend(k.units, prevSnap.units, true, function(d){ var n = Math.round(d); return (n>0?'+':'') + n + ' unit' + (Math.abs(n)===1?'':'s'); }) : null;
    var trendSales = prevSnap ? computeTrend(k.totalSales, prevSnap.totalSales, true, function(d){ return (d>=0?'+':'-') + 'AED ' + fmtCompact(Math.abs(d)); }) : null;
    var trendCollected = prevSnap ? computeTrend(k.collectedPct, prevSnap.collectedPct, true, function(d){ return (d>=0?'+':'') + (Math.round(d*10)/10) + 'pts'; }) : null;
    var trendOutstanding = prevSnap ? computeTrend(k.outstandingPct, prevSnap.outstandingPct, false, function(d){ return (d>=0?'+':'') + (Math.round(d*10)/10) + 'pts'; }) : null;

    html += '<div class="stat-hero">' +
      statCell('Units sold', k.units, '', 'btnUnitsSold', trendUnits) +
      statCell('Sales value', 'AED ' + fmtCompact(k.totalSales), '', 'btnSalesValue', trendSales) +
      statCell('Collected', 'AED ' + fmtCompact(k.totalReceived), k.collectedPct + '% of sales', 'btnCollected', trendCollected) +
      statCell('Outstanding', 'AED ' + fmtCompact(Math.abs(k.totalOutstanding)), k.outstandingPct + '% of sales', 'btnOutstanding', trendOutstanding) +
      '<div class="stat-cell wide"><div class="bar"><div class="bar-fill" style="width:' + Math.min(k.collectedPct,100) + '%"></div></div>' +
        '<p class="bar-caption"><span><b>' + k.collectedPct + '%</b> collected</span><span><b>' + k.outstandingPct + '%</b> outstanding</span></p>' +
      '</div>' +
    '</div>';

    var tm = thisMonthSummary();
    if (tm.any){
      html += '<p class="section-label">This month &middot; ' + esc(tm.monthLabel) + '</p>';
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--paper-line);border:1px solid var(--paper-line);border-radius:12px;overflow:hidden;margin-bottom:22px;">' +
        statCell('Sold this month', tm.count + ' unit' + (tm.count===1?'':'s'), 'AED ' + fmtCompact(tm.value)) +
        (tm.topRm ? statCell('Top RM this month', tm.topRm.name, tm.topRm.units + ' unit' + (tm.topRm.units===1?'':'s') + ' &middot; AED ' + fmtCompact(tm.topRm.value)) : statCell('Top RM this month', '\u2014', '')) +
      '</div>';
    }

    html += '<p class="section-label">SPA status</p>';
    html += '<div class="pipeline">' +
      pillStat(k.spaCounts.signed, 'Signed', 'var(--sage)', 'btnSpaSigned') +
      pillStat(k.spaCounts.drafted, 'Drafted', 'var(--amber)', 'btnSpaDrafted') +
      pillStat(k.spaCounts.none, 'Not started', 'var(--muted)', 'btnSpaNotStarted') +
    '</div>';

    html += '<p class="section-label">OQOOD status</p>';
    html += '<div class="pipeline">' +
      pillStat(k.oqoodCounts.completed, 'Completed', 'var(--sage)', 'btnOqoodCompleted') +
      pillStat(k.oqoodCounts.pending, 'Pending', 'var(--amber)', 'btnOqoodPending') +
      pillStat(k.oqoodCounts.none + k.oqoodCounts.other, 'Not started', 'var(--muted)', 'btnOqoodNotStarted') +
    '</div>';

    html += '<p class="section-label">Furniture status</p>';
    html += '<div class="pipeline">' +
      pillStat(k.furnitureCounts.furnished, 'Furnished', 'var(--sage)', 'btnFurnished') +
      pillStat(k.furnitureCounts.unfurnished, 'Unfurnished', 'var(--muted)', 'btnUnfurnished') +
    '</div>';


    var cf = cashFlowByMonth();
    if (cf.months.length){
      html += '<p class="section-label">Cash flow by month</p>';
      html += '<p class="stat-sub" style="margin:-6px 2px 12px;">Built from your transaction log, so it may miss payments recorded only in Payment Dues before logging began.</p>';

      var selKey = state.selectedMonth;
      if (!selKey || !cf.months.some(function(m){ return m.key === selKey; })){
        var hasCurrent = cf.months.some(function(m){ return m.key === cf.todayKey; });
        selKey = hasCurrent ? cf.todayKey : cf.months[cf.months.length - 1].key;
        state.selectedMonth = selKey;
      }
      var selMonth = cf.months.filter(function(m){ return m.key === selKey; })[0];

      html += '<div class="cf-select-wrap"><select class="cf-select" id="monthSelect">';
      cf.months.forEach(function(m){
        var lbl = monthLabel(m.key) + (m.key === cf.todayKey ? ' \u00b7 this month' : '');
        html += '<option value="' + m.key + '"' + (m.key === selKey ? ' selected' : '') + '>' + lbl + '</option>';
      });
      html += '</select>' + chevronIcon() + '</div>';

      html += '<div class="cf-summary">' +
        cfTile('Received', selMonth.received, 'recv', selMonth.receivedTx.length) +
        cfTile('Due', selMonth.due, 'due', selMonth.dueItems.length) +
      '</div>';

      if (state.cfOpen === 'recv'){
        html += '<div class="month-detail">';
        if (selMonth.receivedTx.length){
          selMonth.receivedTx.forEach(function(t){
            html += '<button class="tx-row tx-row-btn" data-unit="' + esc(t.unit) + '" data-sno="' + esc(t.sno) + '" data-from="overview">' +
              '<span class="tx-date">' + fmtDate(t.date) + '</span>' +
              '<span class="tx-main"><span class="tx-towards">' + esc(titleCase(t.name)) + '</span><br/><span class="tx-status">' + esc(t.towards || 'Payment') + '</span></span>' +
              '<span class="tx-amt">' + fmtAED(t.amount) + '</span>' +
            '</button>';
          });
        } else {
          html += '<div class="tx-empty">Nothing received this month.</div>';
        }
        html += '</div>';
      }
      if (state.cfOpen === 'due'){
        html += '<div class="month-detail">';

          selMonth.dueItems.forEach(function(d){

              '<span class="tx-main"><span class="tx-towards">' + esc(titleCase(d.name)) + '</span><br/><span class="tx-status">' + esc(d.label) + '</span></span>' +
              '<span class="tx-amt">' + fmtAED(d.amount) + '</span>' +

          '<span class="row-amt"><span class="row-amt-val" style="color:var(--rust)">' + fmtAED(entry.overdueAmount) + '</span><span class="row-amt-lbl">overdue</span></span>' +
        '</button>';
      });
      html += '</div>';
    }

    var tasks = followUpTasks();
    var allTaskItems = [];
    tasks.forEach(function(b){
      b.items.forEach(function(item){ allTaskItems.push({item:item, color:b.color}); });
    });
    if (allTaskItems.length){
      html += '<p class="section-label">Follow-up tasks</p>';
      html += '<div class="list" style="padding:8px 0 0;">';
      allTaskItems.forEach(function(entry){
        var item = entry.item, color = entry.color;
        var noteParts = [];
        if (item.updates) noteParts.push(item.updates);
        if (item.remarks) noteParts.push(item.remarks);
        if (item.remarks2) noteParts.push(item.remarks2);
        html += '<button class="row-btn task-row" data-unit="' + esc(item.unit) + '" data-sno="' + esc(item.sno) + '" data-from="overview">' +
          '<span class="row-unit">' + esc(item.unit||'—') + '</span>' +
          '<span class="row-main">' +
            '<span class="row-name">' + esc(titleCase(item.name)) + '</span>' +
            '<span class="row-meta"><span style="color:' + color + '">' + esc(item.action) + '</span></span>' +
            (noteParts.length ? '<span class="task-note">' + esc(noteParts.join(' \u00b7 ')) + '</span>' : '') +
          '</span>' +
        '</button>';
      });
      html += '</div>';
    }

    html += '<p class="footnote">Figures are read directly from your uploaded workbook.</p>';
    html += '</div>'; // .overview

    mainEl.innerHTML = html;
    wireTabs();
    document.querySelectorAll('.row-btn, .tx-row-btn').forEach(function(el){
      el.addEventListener('click', function(){
        goToDetail(el.getAttribute('data-unit'), el.getAttribute('data-sno'), el.getAttribute('data-from') || 'overview');
      });
    });
    var monthSelect = document.getElementById('monthSelect');
    if (monthSelect){
      monthSelect.addEventListener('change', function(e){
        state.selectedMonth = e.target.value;
        state.cfOpen = null;
        renderOverview();
      });
    }
    if (state.reportPickerOpen){

        el.addEventListener('change', function(){
          state.reportSections[el.getAttribute('data-section')] = el.checked;
        });
      });
      document.getElementById('btnConfirmPrint').addEventListener('click', function(){
        state.reportPickerOpen = false;
        printDocument(buildPortfolioReportHTML(), (state.branding.name || 'Sunbliss Residences') + ' \u2014 Executive Summary Report');
        renderOverview();

      document.getElementById('btnCancelPrintPicker').addEventListener('click', function(){
        state.reportPickerOpen = false;
        renderOverview();
      });
    } else {
      document.getElementById('btnPrintReport').addEventListener('click', function(){
        state.reportPickerOpen = true;
        renderOverview();
      });

    document.getElementById('btnUnitsSold').addEventListener('click', function(){ goToUnitsList({payment:'all'}); });
    document.getElementById('btnSalesValue').addEventListener('click', function(){ goToUnitsList({payment:'all'}); });
    document.getElementById('btnCollected').addEventListener('click', function(){ goToUnitsList({payment:'all'}, 'received'); });
    document.getElementById('btnOutstanding').addEventListener('click', function(){ goToUnitsList({payment:'outstanding'}); });
    document.getElementById('btnSpaSigned').addEventListener('click', function(){ goToUnitsList({spa:'signed'}); });
    document.getElementById('btnSpaDrafted').addEventListener('click', function(){ goToUnitsList({spa:'drafted'}); });
    document.getElementById('btnSpaNotStarted').addEventListener('click', function(){ goToUnitsList({spa:'notstarted'}); });
    document.getElementById('btnOqoodCompleted').addEventListener('click', function(){ goToUnitsList({oqood:'completed'}); });
    document.getElementById('btnOqoodPending').addEventListener('click', function(){ goToUnitsList({oqood:'pending'}); });
    document.getElementById('btnOqoodNotStarted').addEventListener('click', function(){ goToUnitsList({oqood:'notstarted'}); });
    document.getElementById('btnFurnished').addEventListener('click', function(){ goToUnitsList({furniture:'furnished'}); });
    document.getElementById('btnUnfurnished').addEventListener('click', function(){ goToUnitsList({furniture:'unfurnished'}); });
    document.querySelectorAll('.cf-tile').forEach(function(el){
      el.addEventListener('click', function(){
        var key = el.getAttribute('data-cf');
        state.cfOpen = (state.cfOpen === key) ? null : key;
        renderOverview();
      });
    });
  }
