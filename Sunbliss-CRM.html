        statCell('Cancelled', cs.count, '') +
        statCell('Value lost', 'AED ' + fmtCompact(cs.totalValue), '') +
        statCell('Received before', 'AED ' + fmtCompact(cs.totalReceived), '') +
      '</div>';
      html += '<div class="list" style="padding:0;">';
      cs.units.forEach(function(c){
        html += '<div class="row-btn" style="cursor:default;">' +
          '<span class="row-unit">' + esc(c.unit||'\u2014') + '</span>' +
          '<span class="row-main"><span class="row-name">' + esc(titleCase(c.name)) + '</span>' +
            '<span class="row-meta"><span>' + esc(c.type||'') + '</span></span></span>' +
          '<span class="row-amt"><span class="row-amt-val">' + fmtAED(c.received) + '</span>' +
            '<span class="row-amt-lbl">received</span></span>' +
        '</div>';

    var bp = brokerPerformance();

        pillStat(bp.directCount, 'Direct \u00b7 AED ' + fmtCompact(bp.directValue), 'var(--slate)') +
        pillStat(bp.brokerCount, 'Broker \u00b7 AED ' + fmtCompact(bp.brokerValue), 'var(--gold-deep)') +
      '</div>';

          html += '<div class="row-btn" style="cursor:default;">' +
            '<span class="row-main"><span class="row-name">' + esc(titleCase(b.name)) + '</span>' +
              '<span class="row-meta"><span>' + esc(b.company ? titleCase(b.company) : '') + (b.company ? ' \u00b7 ' : '') + b.units + ' unit' + (b.units===1?'':'s') + '</span></span></span>' +
            '<span class="row-amt"><span class="row-amt-val" style="color:var(--ink)">AED ' + fmtCompact(b.value) + '</span>' +
              '<span class="row-amt-lbl">' + b.pct + '% collected</span></span>' +
          '</div>';
        });
        html += '</div>';

    var rmp = rmPerformance();

      rmp.rms.forEach(function(r){
        html += '<div class="row-btn" style="cursor:default;">' +
          '<span class="row-main"><span class="row-name">' + esc(r.name) + '</span>' +
            '<span class="row-meta"><span>' + r.units + ' unit' + (r.units===1?'':'s') + '</span></span></span>' +
          '<span class="row-amt"><span class="row-amt-val" style="color:var(--ink)">AED ' + fmtCompact(r.value) + '</span>' +
            '<span class="row-amt-lbl">' + r.pct + '% collected</span></span>' +
        '</div>';
      });
      html += '</div>';

    var sv = salesVelocity();
    if (sv.any && sv.months.length){
      html += '<p class="section-label">Monthly sales value &middot; by booking date</p>';
      html += svgValueTrendChart(sv.months, {width:520, height:170});
      html += '<div style="margin-top:6px;">';
      sv.months.forEach(function(m){
        var growth = m.growthPct === null ? '' :
          ' <span style="color:' + (m.growthPct >= 0 ? 'var(--sage)' : 'var(--rust)') + ';font-weight:600;">' + (m.growthPct >= 0 ? '+' : '') + m.growthPct + '%</span>';
        html += '<div class="mix-row"><span class="mix-label">' + esc(monthLabel(m.key)) + '</span><span class="mix-count">' + m.count + ' unit' + (m.count===1?'':'s') + '</span><span class="mix-value">AED ' + fmtCompact(m.value) + growth + '</span></div>';
      });
      html += '</div>';

    html += '<p class="footnote">Figures are read directly from your uploaded workbook.</p>';
    html += '</div>';

    mainEl.innerHTML = html;
    wireTabs();
    if (dld.any){
      document.getElementById('btnDldPaid').addEventListener('click', function(){ goToUnitsList({dld:'paid'}); });
      document.getElementById('btnDldOutstanding').addEventListener('click', function(){ goToUnitsList({dld:'outstanding'}); });
      document.getElementById('btnDldFullyPaid').addEventListener('click', function(){ goToUnitsList({dld:'paid'}); });
      document.getElementById('btnDldPartial').addEventListener('click', function(){ goToUnitsList({dld:'partial'}); });
      document.getElementById('btnDldNotStarted').addEventListener('click', function(){ goToUnitsList({dld:'notstarted'}); });
    }
  }

  function renderList(){
    var today = new Date();
    var q = state.search.trim().toLowerCase();
    var f = state.filters;

    var typeSet = {};
    state.dues.forEach(function(c){ typeSet[unitTypeKey(c)] = true; });
    var types = Object.keys(typeSet).sort(function(a,b){ return a.localeCompare(b, undefined, {numeric:true}); });

    var withDerived = state.dues.map(function(c){ return {c:c, d:customerDerived(c, today)}; });

    var filtered = withDerived.filter(function(x){
      var c = x.c, d = x.d;
      if (q){
        var hay = (c.name + ' ' + c.unit).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (f.payment === 'overdue' && d.overdueCount === 0) return false;
      if (f.payment === 'outstanding' && !(c.outstanding !== null && c.outstanding < -1)) return false;
      if (f.payment === 'paid' && (c.outstanding !== null && c.outstanding < -1)) return false;
      if (f.spa === 'signed' && (c.spa||'').toLowerCase() !== 'signed') return false;
      if (f.spa === 'drafted' && (c.spa||'').toLowerCase() !== 'drafted') return false;
      if (f.spa === 'notstarted' && (c.spa||'').trim() !== '') return false;
      if (f.oqood === 'completed' && (c.oqood||'').toLowerCase() !== 'completed') return false;
      if (f.oqood === 'pending' && (c.oqood||'').toLowerCase() !== 'pending') return false;
      if (f.oqood === 'notstarted' && (c.oqood||'').trim() !== '') return false;
      if (f.furniture === 'furnished' && (c.furniture||'').toLowerCase() !== 'signed') return false;
      if (f.furniture === 'unfurnished' && (c.furniture||'').toLowerCase() === 'signed') return false;
      if (f.unitType && unitTypeKey(c) !== f.unitType) return false;
      if (f.dld){
        var dldStatus = customerDldStatus(c);
        if (f.dld === 'outstanding'){
          if (dldStatus === 'paid' || dldStatus === null) return false;
        } else if (dldStatus !== f.dld){
          return false;
        }
      }
      return true;
    });

    if (state.sortBy === 'received'){
      filtered.sort(function(a,b){ return (b.c.received||0) - (a.c.received||0); }); // most collected first
    } else {
      filtered.sort(function(a,b){
        var ao = a.c.outstanding===null?0:a.c.outstanding, bo = b.c.outstanding===null?0:b.c.outstanding;
        return ao - bo; // most negative (most owed) first
      });
    }

    var sumValue = filtered.reduce(function(s,x){ return s + (x.c.total||0); }, 0);
    var sumOutstanding = filtered.reduce(function(s,x){ return s + Math.abs(x.c.outstanding||0); }, 0);

    var FILTER_LABELS = {
      payment: {overdue:'Overdue', outstanding:'Outstanding', paid:'Fully Paid'},
      spa: {signed:'SPA Signed', drafted:'SPA Drafted', notstarted:'SPA Not Started'},
      oqood: {completed:'OQOOD Completed', pending:'OQOOD Pending', notstarted:'OQOOD Not Started'},
      furniture: {furnished:'Furnished', unfurnished:'Unfurnished'},
      dld: {paid:'DLD Paid', partial:'DLD Partial', notstarted:'DLD Not Started', outstanding:'DLD Outstanding'}
    };
    var activeList = [];
    if (f.payment !== 'all') activeList.push({group:'payment', value:f.payment, label:FILTER_LABELS.payment[f.payment]});
    if (f.spa) activeList.push({group:'spa', value:f.spa, label:FILTER_LABELS.spa[f.spa]});
    if (f.oqood) activeList.push({group:'oqood', value:f.oqood, label:FILTER_LABELS.oqood[f.oqood]});
    if (f.furniture) activeList.push({group:'furniture', value:f.furniture, label:FILTER_LABELS.furniture[f.furniture]});
    if (f.unitType) activeList.push({group:'unitType', value:f.unitType, label:f.unitType});
    if (f.dld) activeList.push({group:'dld', value:f.dld, label:FILTER_LABELS.dld[f.dld]});
    var anyFilterActive = activeList.length > 0;

    var html = renderTabs('list');

    html += '<div class="controls">' +
      '<div class="search">' + searchIcon() + '<input type="text" id="searchInput" placeholder="Search unit or customer name" value="' + esc(state.search) + '" /></div>';

    if (anyFilterActive && !state.filtersExpanded){
      html += '<div class="active-pills">' + activeList.map(function(a){
        return '<button class="active-pill" data-remove-group="' + a.group + '">' + esc(a.label) + '<span class="x">&times;</span></button>';
      }).join('') + '</div>';
    }

    html += '<button class="filter-toggle" id="btnToggleFilters" aria-expanded="' + state.filtersExpanded + '">' +
      '<span class="filter-toggle-left">Filters' + (anyFilterActive ? ' <span class="filter-badge">' + activeList.length + '</span>' : '') + '</span>' +
      chevronIcon() +
    '</button>';

    if (state.filtersExpanded){
      html += '<div class="filter-panel">' +
        '<div class="filter-group"><p class="filter-group-label">Payment</p><div class="chips">' + fchip('payment','all','All') + fchip('payment','overdue','Overdue') + fchip('payment','outstanding','Outstanding') + fchip('payment','paid','Fully Paid') + '</div></div>' +
        '<div class="filter-group"><p class="filter-group-label">SPA</p><div class="chips">' + fchip('spa','signed','Signed') + fchip('spa','drafted','Drafted') + fchip('spa','notstarted','Not Started') + '</div></div>' +
        '<div class="filter-group"><p class="filter-group-label">OQOOD</p><div class="chips">' + fchip('oqood','completed','Completed') + fchip('oqood','pending','Pending') + fchip('oqood','notstarted','Not Started') + '</div></div>' +
        '<div class="filter-group"><p class="filter-group-label">Furniture</p><div class="chips">' + fchip('furniture','furnished','Furnished') + fchip('furniture','unfurnished','Unfurnished') + '</div></div>' +
        (types.length > 1 ? '<div class="filter-group"><p class="filter-group-label">Unit Type</p><div class="chips">' + types.map(function(t){ return fchip('unitType', t, t); }).join('') + '</div></div>' : '') +
        '<div class="filter-group"><p class="filter-group-label">DLD</p><div class="chips">' + fchip('dld','paid','Paid') + fchip('dld','partial','Partial') + fchip('dld','notstarted','Not Started') + '</div></div>' +
        (anyFilterActive ? '<button class="btn-clear-filters" id="btnClearFilters">Clear all filters</button>' : '') +
      '</div>';
    }

    html +=
      '<p class="result-count">' + filtered.length + ' of ' + state.dues.length + ' units &middot; AED ' + fmtCompact(sumValue) + ' total value &middot; AED ' + fmtCompact(sumOutstanding) + ' outstanding</p>' +
      '<button class="btn-paper" id="btnExportList" style="margin-top:2px;">' + downloadIcon() + 'Export this list</button>' +
      '<p class="brand-error" id="exportError" style="display:none;"></p>' +
    '</div>';

    html += '<div class="list">';
    if (filtered.length === 0){
      html += '<div class="no-results">No units match that search.</div>';
    } else {
      filtered.forEach(function(x){
        var c = x.c, d = x.d;
        var status = paymentStatusLine(c);
        var isOverdue = status && status.overdue;
        var hasUpcoming = c.upStage && c.upAmt !== null;
        var stageLabel = hasUpcoming ? (c.upStage.length > 24 ? c.upStage.slice(0,21) + '\u2026' : c.upStage) : '';

        var amtVal, amtLbl, amtColor;
        if (state.sortBy === 'received'){
          amtVal = fmtAED(c.received); amtLbl = 'received'; amtColor = 'var(--sage)';
        } else if (hasUpcoming){
          amtVal = fmtAED(c.upAmt);
          amtColor = isOverdue ? 'var(--rust)' : 'var(--sage)';
          amtLbl = esc(stageLabel) + (c.upDate ? (' \u00b7 ' + (isOverdue ? 'was due ' : 'due ') + fmtDate(c.upDate)) : (isOverdue ? ' \u00b7 overdue' : ''));
        } else {
          amtVal = fmtAED(c.outstanding); amtLbl = 'fully paid'; amtColor = 'var(--sage)';
        }

        html += '<button class="row-btn" data-unit="' + esc(c.unit) + '" data-sno="' + esc(c.sno) + '">' +
          '<span class="row-unit">' + esc(c.unit||'—') + '</span>' +
          '<span class="row-main">' +
            '<span class="row-name">' + esc(titleCase(c.name)) + '</span>' +
            '<span class="row-meta">' +
              '<span style="color:' + ((c.spa||'').toLowerCase()==='signed' ? 'var(--sage)' : 'var(--amber)') + ';font-weight:600;">' + esc(c.spa ? 'SPA ' + c.spa : 'SPA Not Signed') + '</span>' +
              (d.overdueCount > 0 ? '<span class="row-dot"></span><span>' + d.overdueCount + ' overdue</span>' : '') +
            '</span>' +
          '</span>' +
          '<span class="row-amt">' +
            '<span class="row-amt-val" style="color:' + amtColor + '">' + amtVal + '</span><span class="row-amt-lbl">' + amtLbl + '</span>' +
          '</span>' +
        '</button>';
      });
    }
    html += '</div>';
    html += '<p class="footnote">Figures are read directly from your uploaded workbook.</p>';

    mainEl.innerHTML = html;

    wireTabs();
    document.getElementById('searchInput').addEventListener('input', function(e){
      state.search = e.target.value; renderList();
    });
    document.getElementById('btnToggleFilters').addEventListener('click', function(){
      state.filtersExpanded = !state.filtersExpanded;
      renderList();
    });
    document.querySelectorAll('.chip[data-group]').forEach(function(el){
      el.addEventListener('click', function(){
        var group = el.getAttribute('data-group');
        var value = el.getAttribute('data-value');
        if (group === 'payment'){
          state.filters.payment = (state.filters.payment === value) ? 'all' : value;
        } else {
          state.filters[group] = (state.filters[group] === value) ? null : value;
        }
        renderList();
      });
    });
    document.querySelectorAll('.active-pill').forEach(function(el){
      el.addEventListener('click', function(){
        var group = el.getAttribute('data-remove-group');
        state.filters[group] = (group === 'payment') ? 'all' : null;
        renderList();

    }catch(err){
      state.error='Could not load CRM data from Supabase: ' + (err && err.message ? err.message : String(err));
      state.view='empty'; state.syncedAt=null; render();
    }
  }

  /* ============ file handling ============ */
  document.addEventListener('DOMContentLoaded', function(){
    var fileInput = document.getElementById('fileInput');
    fileInput.addEventListener('change', function(e){
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        try{
          var data = new Uint8Array(ev.target.result);
          var wb = XLSX.read(data, {type:'array', cellDates:true});
          var parsed = parseWorkbook(wb);
          state.dues = parsed.dues;
          state.recent = parsed.recent;
          state.cancelled = parsed.cancelled;
          state.fileName = file.name;
          state.syncedAt = new Date().toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
          state.error = null;
          state.view = 'overview';
          state.selectedUnit = null;
          saveToStorage();
          render();
          saveSnapshot(portfolioStats());
        }catch(err){
          state.error = err && err.message ? err.message : 'Could not read that file.';
          state.view = 'empty';
          render();
        }
      };
      reader.onerror = function(){
        state.error = 'Could not read that file. Please try again.';
        state.view = 'empty';
        render();
      };
      reader.readAsArrayBuffer(file);
      fileInput.value = '';
    });

    loadBranding().then(loadSnapshot).then(loadFromSupabase);
  });
})();
</script>
</body>
</html>
