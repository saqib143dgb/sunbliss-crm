name: Import SPA reference template

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-spa-reference.yml'

permissions:
  contents: write

jobs:
  import-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download sanitized SPA reference
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/OwOaGACdBXXF2Z0W' -o spa-reference.pdf
          test "$(stat -c%s spa-reference.pdf)" -gt 1000000
          test "$(head -c 4 spa-reference.pdf)" = "%PDF"
      - name: Commit template
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spa-reference.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add sanitized SPA reference template"
          git push origin HEAD:main
